name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore from legacy chunks if needed
        run: |
          if [ ! -f package.json ]; then
            python3 scripts/restore-chunks.py
          else
            echo "package.json present"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Join split source parts
        run: node scripts/join-srcparts.mjs
      - run: npm run build
      - name: Publish dist to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
      - name: Point Pages at gh-pages branch
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const source = { branch: 'gh-pages', path: '/' };
            try {
              await github.request('POST /repos/{owner}/{repo}/pages', { owner, repo, source });
            } catch (e) {
              const status = e.status || e.response?.status;
              if (status === 409 || status === 422) {
                try { await github.request('PUT /repos/{owner}/{repo}/pages', { owner, repo, source }); }
                catch (e2) { core.warning(String(e2)); }
              } else { core.warning(String(e)); }
            }
